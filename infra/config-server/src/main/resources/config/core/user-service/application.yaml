spring:
  output:
    ansi:
      enabled: ALWAYS

  application:
    name: user-service

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=ewm_users
    username: postgres
    password: password

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

eureka:
  instance:
    instance-id: "${spring.application.name}:${server.port}:${random.value}"

server:
  port: 0

logging:
  level:
    root: INFO
    org.hibernate: ERROR
    org.hibernate.SQL: OFF