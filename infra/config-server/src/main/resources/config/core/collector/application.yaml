grpc:
  server:
    port: 0

server:
  port: 0

spring:
  output:
    ansi:
      enabled: ALWAYS

  application:
    name: collector

  kafka:
    producer:
      value-serializer: ru.practicum.ewm.stats.kafka.serializer.AvroSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

collector:
  kafka:
    topic:
      user-actions: stats.user-actions.v1