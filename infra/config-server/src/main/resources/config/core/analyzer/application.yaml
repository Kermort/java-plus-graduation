grpc:
  server:
    port: 0

server:
  port: 0

spring:
  output:
    ansi:
      enabled: ALWAYS

  application:
    name: analyzer

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=ewm_analyzer
    username: postgres
    password: password

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  kafka:
    consumer:
      group-id: analyzer-group
      auto-offset-reset: earliest

analyzer:
  kafka:
    topic:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1

  recommendations:
    action-weights:
      VIEW: 0.4
      REGISTER: 0.8
      LIKE: 1.0

logging:
  level:
    root: INFO
    org.hibernate: ERROR
    org.hibernate.SQL: OFF