spring:
  output:
    ansi:
      enabled: ALWAYS

  application:
    name: stats-server

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6541/postgres?currentSchema=ewm_stats
    username: postgres
    password: password

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  sql:
    init:
      mode: always

eureka:
  instance:
    instance-id: "${spring.application.name}:${server.port}:${random.value}"

server:
  port: 0

logging:
  level:
    root: INFO
    org.hibernate: ERROR
    org.hibernate.SQL: OFF