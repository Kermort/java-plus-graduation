spring:
  output:
    ansi:
      enabled: ALWAYS

  application:
    name: gateway-server

  cloud:
    gateway:
      discovery.locator.enabled: true

      routes:
        - id: main_service_route
          uri: lb://main-service
          predicates:
            - Path=/**
#        - id: stats-server_route
#          uri: lb://stats-server

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: 8080

logging:
  level:
    root: INFO