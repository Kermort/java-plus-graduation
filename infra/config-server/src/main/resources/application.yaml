spring:
  output:
    ansi:
      enabled: always

  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          searchLocations:
            - classpath:config/core/{application}
            - classpath:config/infra/{application}

server:
  port: 0

eureka:
  instance:
    instance-id: "${spring.application.name}:${server.port}:${random.value}"
  client:
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO