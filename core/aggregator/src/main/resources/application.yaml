spring:
  application:
    name: aggregator

  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 10000

eureka:
  instance:
    instance-id: "${spring.application.name}:${server.port}:${random.value}"
  client:
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/